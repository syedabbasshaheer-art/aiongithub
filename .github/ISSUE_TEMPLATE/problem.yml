name: Report a problem
description: Something does not work or does not look right
title: "Problem: "
labels: ["problem"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Phone or computer, and which browser?
      description: For example: a laptop with Firefox.
    validations:
      required: true
